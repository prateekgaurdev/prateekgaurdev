<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#241b3d"/>
      <stop offset="55%" stop-color="#140f28"/>
      <stop offset="100%" stop-color="#07050d"/>
    </radialGradient>

    <radialGradient id="nameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6a5cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd6ff"/>
      <stop offset="35%" stop-color="#7c6bff"/>
      <stop offset="65%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#4fffd6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6fd8ff"/>
      <stop offset="35%" stop-color="#8f7bff"/>
      <stop offset="60%" stop-color="#4be39a"/>
      <stop offset="100%" stop-color="#7ea8ff"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="400" rx="26" fill="url(#bgGlow)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="70"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="140" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="60"  r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="100" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="65"  r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="130" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="75"  r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="150" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="320" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="310" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="345" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="330" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="330" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- jagged lightning bolts, left + right -->
  <polyline points="140,40 175,150 150,150 190,260 165,260 155,360" fill="none" stroke="#37e6c4" stroke-width="2" stroke-linejoin="round" opacity="0.35"/>
  <polyline points="1060,40 1025,150 1050,150 1010,260 1035,260 1045,360" fill="none" stroke="#8f6bff" stroke-width="2" stroke-linejoin="round" opacity="0.35"/>

  <!-- corner brackets -->
  <g stroke="#34e6a8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40,70 L40,40 L70,40"/>
    <path d="M1130,40 L1160,40 L1160,70"/>
    <path d="M40,330 L40,360 L70,360"/>
    <path d="M1130,360 L1160,360 L1160,330"/>
  </g>

  <!-- constant glowing neon border (the "wire") -->
  <rect x="16" y="16" width="1168" height="368" rx="26" fill="none" stroke="url(#borderGrad)" stroke-width="10" opacity="0.28" filter="url(#softGlow)"/>
  <rect x="16" y="16" width="1168" height="368" rx="26" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.9"/>

  <!-- the moving "current" — a bright pulse that continuously travels around the border -->
  <rect x="16" y="16" width="1168" height="368" rx="26" fill="none" stroke="#eafcff" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="60 2940" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-3000" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="16" y="16" width="1168" height="368" rx="26" fill="none" stroke="#9be8ff" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="60 2940" filter="url(#glow)" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="1500;-1500" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- soft ambient glow behind the name -->
  <ellipse cx="600" cy="205" rx="420" ry="140" fill="url(#nameGlow)" opacity="0.35" filter="url(#softGlow)"/>

  <!-- username label -->
  <text x="600" y="150" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="17"
        letter-spacing="6" fill="#3ee6c0">‹ PRATEEKGAURDEV ›</text>

  <!-- name -->
  <text x="600" y="230" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-weight="bold"
        font-size="72" fill="url(#textGrad)">Prateek Gaur</text>

  <!-- dashed divider -->
  <line x1="430" y1="260" x2="770" y2="260" stroke="#6fb8ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>

  <!-- tagline -->
  <text x="600" y="300" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="21"
        letter-spacing="1" fill="#dce6f5">AI Engineer • Full-Stack Systems Builder</text>
</svg>
